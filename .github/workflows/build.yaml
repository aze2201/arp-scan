name: Build & Release

#on:
#  push:
#    tags:
#      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: make

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/arp-scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

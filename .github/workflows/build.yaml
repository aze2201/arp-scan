name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Make
        run: sudo apt-get update -y && sudo apt-get install -y make gcc
        
      - run: make all

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/arp-scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
